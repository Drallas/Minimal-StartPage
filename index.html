<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Minimalist Start Page</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="color.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body class="preload">
  <div id="container">
    <div id="wallpaper" class="wallpaper" aria-hidden="true"></div>
    <span class="blob blob-a" aria-hidden="true"></span>
    <span class="blob blob-b" aria-hidden="true"></span>

    <header class="topbar">
      <div class="links-wrap">
        <button type="button" class="icon-link links-button" id="links-button" aria-haspopup="dialog" aria-label="Links" title="Links">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
        </button>
        <div class="links-preview" id="links-preview"></div>
      </div>
      <div class="weather">
        <button type="button" id="weather-button" aria-expanded="false" aria-controls="weather-detail">Show weather</button>
        <div class="weather-detail" id="weather-detail"></div>
      </div>
      <div class="topright">
      <div class="modes" role="group" aria-label="Color mode">
        <button type="button" data-theme-value="auto" title="System theme" aria-label="System theme" aria-pressed="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
        <button type="button" data-theme-value="dark" title="Dark theme" aria-label="Dark theme" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
        <button type="button" data-theme-value="light" title="Light theme" aria-label="Light theme" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      </div>
        <button type="button" id="settings-button" class="settings-button" aria-label="Settings" title="Settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>
    </header>

    <main id="main">
      <div id="clock"><div class="zones-wrap"><button type="button" id="zones-button" class="zones-button" hidden><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></button><div class="zones-preview" id="zones-preview"></div></div><time id="time" title="Click to cycle through 24-hour, 12-hour and full time"></time><div class="date-row"><span id="date"></span></div></div>
      <form id="searchform" class="searchbar" role="search" title="Type a search and press Enter">
        <label for="search" class="sr-only">Search the web</label>
        <input id="search" type="text" autocomplete="off">
        <button id="engine" type="button" aria-label="Change search engine" title="Change search engine"></button>
        <button id="go" type="submit" title="Search" aria-label="Search"><svg width="18" height="18" viewBox="0 0 512 512" aria-hidden="true" focusable="false"><path fill="currentColor" transform="matrix(1 0 0 -1 0 448)" d="M505 5.2998c9.2998 -9.39941 9.2998 -24.5996 -0.0996094 -34l-28.3008 -28.2998c-9.2998 -9.40039 -24.5 -9.40039 -33.8994 0l-99.7002 99.7002c-4.5 4.5 -7 10.5996 -7 17v16.2998c-35.2998 -27.5996 -79.7002 -44 -128 -44c-114.9 0 -208 93.0996 -208 208s93.0996 208 208 208s208 -93.0996 208 -208c0 -48.2998 -16.4004 -92.7002 -44 -128h16.2998c6.40039 0 12.5 -2.5 17 -7zM208 112c70.7998 0 128 57.2998 128 128c0 70.7998 -57.2998 128 -128 128c-70.7998 0 -128 -57.2998 -128 -128c0 -70.7998 57.2998 -128 128 -128z"/></svg></button>
      </form>

      <nav class="links" id="ask-ai" aria-label="Shortcuts">
        <button type="button" class="caption caption-button" id="ask-ai-edit" title="Edit AI shortcuts">Ask AI</button>
        <ul id="ask-ai-list"></ul>
      </nav>
    </main>

    <button id="quote" class="quote" type="button" title="Show another quote"><span id="quote-text">Show another quote</span><span id="quote-by"></span></button>

    <div class="controls">
      <button type="button" id="tint-cycle" class="tint-cycle" hidden aria-label="Change colour" title="Change colour"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle class="dot" cx="12" cy="12" r="4.5"/></svg></button>
      <input id="hue" class="hue" type="range" min="0" max="360" value="180" aria-label="Background tint (the middle is neutral)" title="Background tint">
      <button type="button" id="wallpaper-toggle" aria-label="Hide wallpaper" title="Hide wallpaper" aria-pressed="true"><span></span><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></button>
    </div>

    <footer><a href="https://github.com/Drallas/Minimal-StartPage#readme" id="foot-link" title="View the README on GitHub"><span id="foot-pre">Vibe coded with</span> <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/></svg> <span id="foot-post">by Allards</span></a></footer>
  </div>
  <div class="settings" id="settings" hidden>
    <div class="settings-panel" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="settings-head">
        <h2 id="settings-title">Settings</h2>
        <button type="button" id="help-open" class="text-button">Help</button>
        <button type="button" id="settings-close" class="settings-close" aria-label="Close">×</button>
      </div>
      <p class="settings-hint" id="settings-hint"></p>
      <div class="presets" role="radiogroup" aria-label="Page">
        <label class="setting"><input type="radio" name="preset" id="preset-minimal" value="minimal"> <span id="lbl-preset-minimal">Minimal</span></label>
        <label class="setting"><input type="radio" name="preset" id="preset-standard" value="standard"> <span id="lbl-preset-standard">Standard</span></label>
        <label class="setting"><input type="radio" name="preset" id="preset-custom" value="custom"> <span id="lbl-preset-custom">Personal</span></label>
      </div>
      <div class="settings-actions">
        <button type="button" id="advanced-toggle" aria-expanded="false" aria-controls="advanced">Advanced</button>
        <button type="button" id="manage-open">Manage</button>
        <button type="button" id="ip-open">IP details</button>
      </div>
      <div class="advanced" id="advanced" hidden>
        <section class="adv-group">
          <p class="location-title" id="sec-weather">Weather</p>
          <label class="setting"><input type="checkbox" id="set-weather"> <span id="lbl-weather">On</span></label>
          <div class="weather-sub" id="weather-sub">
            <p class="location-title" id="lbl-location">Location</p>
            <label class="setting"><input type="radio" name="location" id="loc-ip" value="ip"> <span id="lbl-loc-ip">My place via IP address</span></label>
            <p class="privacy" id="privacy"></p>
            <label class="setting"><input type="radio" name="location" id="loc-city" value="city"> <span id="lbl-loc-city">A city I choose</span></label>
            <form class="city-form" id="city-form">
              <label for="city-input" id="lbl-city">Or enter a city</label>
              <div class="city-row">
                <input type="text" id="city-input" autocomplete="off">
                <button type="submit" id="city-save">Save</button>
              </div>
              <button type="button" id="city-clear" class="text-button" hidden>Use my IP address instead</button>
              <p class="city-msg" id="city-msg" role="status"></p>
            </form>
          </div>
        </section>
        <section class="adv-group">
          <p class="location-title" id="sec-look">Show</p>
          <label class="setting"><input type="checkbox" id="set-quote"> <span id="lbl-quote">Quote</span></label>
          <label class="setting"><input type="checkbox" id="set-links"> <span id="lbl-links">Links button</span></label>
          <label class="setting"><input type="checkbox" id="set-links-own"> <span id="lbl-links-own">Own links</span></label>
          <label class="setting"><input type="checkbox" id="set-zones"> <span id="lbl-zones">Time zones</span></label>
          <label class="setting"><input type="checkbox" id="set-wallpaper-btn"> <span id="lbl-wallpaper-btn">Wallpaper button</span></label>
        </section>
        <section class="adv-group">
          <p class="location-title" id="sec-ai">AI shortcuts</p>
          <label class="setting"><input type="checkbox" id="set-askai"> <span id="lbl-askai">On</span></label>
        </section>
        <section class="adv-group">
          <p class="location-title" id="sec-bg">Background</p>
          <label class="setting"><input type="checkbox" id="set-wallpaper"> <span id="lbl-wallpaper">Wallpaper</span></label>
          <label class="setting"><input type="checkbox" id="set-tint"> <span id="lbl-tint">Background tint</span></label>
        </section>
        <div class="reset-row">
          <button type="button" id="reset-settings" class="text-button">Reset settings</button>
          <button type="button" id="reset-data" class="text-button">Delete my links, AI shortcuts and places</button>
        </div>
      </div>
    </div>
  </div>

  <div class="settings" id="manage" hidden>
    <div class="settings-panel manage-panel" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="manage-title">
      <div class="settings-head">
        <h2 id="manage-title">Manage</h2>
        <button type="button" id="manage-close" class="settings-close" aria-label="Close">×</button>
      </div>
      <div class="manage-tabs" role="tablist">
        <button type="button" role="tab" class="manage-tab-button" data-tab="links" id="tab-links" aria-controls="section-links">Links</button>
        <button type="button" role="tab" class="manage-tab-button" data-tab="zones" id="tab-zones" aria-controls="section-zones">Time zones</button>
        <button type="button" role="tab" class="manage-tab-button" data-tab="ai" id="tab-ai" aria-controls="section-ai">AI</button>
        <button type="button" role="tab" class="manage-tab-button" data-tab="weather" id="tab-weather" aria-controls="section-weather">Weather</button>
      </div>
      <section class="manage-section" data-tab="links" id="section-links" role="tabpanel" aria-labelledby="tab-links" tabindex="0" hidden>
      <div class="links-list" id="links-list"></div>
      <form class="link-form" id="link-form">
        <p class="link-form-title" id="link-form-title">Add link</p>
        <label for="link-name" id="lbl-link-name">Name</label>
        <input type="text" id="link-name" autocomplete="off">
        <label for="link-url" id="lbl-link-url">Address</label>
        <input type="text" id="link-url" inputmode="url" autocomplete="off" placeholder="https://">
        <label for="link-desc" id="lbl-link-desc">Description (optional)</label>
        <input type="text" id="link-desc" maxlength="120" autocomplete="off">
        <div class="link-form-actions">
          <button type="submit" id="link-save">Save</button>
          <button type="button" id="link-cancel" class="text-button" hidden>Cancel</button>
        </div>
        <p class="city-msg" id="link-msg" role="status"></p>
      </form>
      </section>
      <section class="manage-section" data-tab="zones" id="section-zones" role="tabpanel" aria-labelledby="tab-zones" tabindex="0" hidden>
      <p class="zones-local" id="zones-local"></p>
      <div id="zones-list"></div>
      <form class="city-form" id="zone-form">
        <label for="zone-input" id="zone-label">Add a time zone (up to five)</label>
        <div class="city-row">
          <input type="text" id="zone-input" list="zone-options" autocomplete="off">
          <button type="submit" id="zone-add-btn">Add</button>
        </div>
        <datalist id="zone-options"></datalist>
        <p class="city-msg" id="zone-msg" role="status"></p>
      </form>
      </section>
      <section class="manage-section" data-tab="ai" id="section-ai" role="tabpanel" aria-labelledby="tab-ai" tabindex="0" hidden>
      <ul class="ai-list" id="ai-list"></ul>
      <form class="link-form" id="ai-form">
        <p class="link-form-title" id="ai-form-title">Add shortcut</p>
        <label for="ai-name" id="lbl-ai-name">Name</label>
        <input type="text" id="ai-name" autocomplete="off">
        <label for="ai-url" id="lbl-ai-url">Address</label>
        <input type="text" id="ai-url" inputmode="url" autocomplete="off" placeholder="https://">
        <div class="link-form-actions">
          <button type="submit" id="ai-save">Save</button>
          <button type="button" id="ai-cancel" class="text-button" hidden>Cancel</button>
        </div>
        <p class="city-msg" id="ai-msg" role="status"></p>
      </form>
      </section>
      <section class="manage-section" data-tab="weather" id="section-weather" role="tabpanel" aria-labelledby="tab-weather" tabindex="0" hidden>
        <p class="manage-note" id="weather-own"></p>
        <ul class="place-list" id="place-list"></ul>
        <form class="city-form" id="place-form">
          <label for="place-input" id="lbl-place">Add a city</label>
          <div class="city-row">
            <input type="text" id="place-input" autocomplete="off">
            <button type="submit" id="place-add">Add</button>
          </div>
          <p class="city-msg" id="place-msg" role="status"></p>
        </form>
      </section>
      <div class="manage-io">
          <button type="button" id="export-data" class="text-button">Export data</button>
          <button type="button" id="import-data" class="text-button">Import data</button>
          <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
    </div>
  </div>
  <div class="settings" id="ip-window" hidden>
    <div class="settings-panel ip-panel" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="ip-window-title">
      <div class="settings-head">
        <h2 id="ip-window-title">IP details</h2>
        <button type="button" id="ip-window-close" class="settings-close" aria-label="Close">×</button>
      </div>
      <p class="ip-current" id="ip-value"></p>
      <p class="ip-meta" id="ip-meta"></p>
      <button type="button" class="ghost-button" id="ip-check"></button>
      <p class="ip-meta" id="ip-status" aria-live="polite"></p>
      <dl class="ip-list" id="ip-list"></dl>
    </div>
  </div>
  <div class="settings" id="links-window" hidden>
    <div class="settings-panel links-panel" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="links-window-title">
      <div class="settings-head">
        <h2 id="links-window-title">Links</h2>
        <button type="button" id="links-window-close" class="settings-close" aria-label="Close">×</button>
      </div>
      <div class="link-icons" id="links-window-icons"></div>
      <div class="links-own" id="links-own"></div>
      <button type="button" id="links-manage" class="ghost-button">Manage</button>
    </div>
  </div>
  <div class="settings" id="forecast" hidden>
    <div class="settings-panel forecast-panel" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="forecast-title">
      <div class="settings-head">
        <h2 id="forecast-title">Weather</h2>
        <button type="button" id="forecast-close" class="settings-close" aria-label="Close">×</button>
      </div>
      <div class="forecast-places" id="forecast-places"></div>
      <div id="forecast-body"></div>
      <a class="forecast-link" id="forecast-link" href="https://www.windy.com/" target="_blank" rel="noopener"></a>
    </div>
  </div>

  <div class="settings" id="help" hidden>
    <div class="settings-panel help-panel" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <div class="settings-head">
        <h2 id="help-title">Help</h2>
        <button type="button" id="help-close" class="settings-close" aria-label="Close">×</button>
      </div>
      <div class="help-body" id="help-body"></div>
    </div>
  </div>
  <script src="quotes.js"></script>
  <script src="script.js"></script>
</body>
</html>
